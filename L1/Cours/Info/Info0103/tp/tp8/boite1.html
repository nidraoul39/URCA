<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Les boîtes</title>
  </head>
  <body>
    <style>
.container {
    border: 1px solid black;
    background-color: teal;
}
.box {
    height: 100px;
    width: 100px;
    border: 15px solid black;
    margin: 10px;
    padding: 10px;
    background-color: pink;
}
    </style>
    <h1>Test sur les boîtes</h1>
    
    <div class="container">
      <div class="box">Ceci est un grand texte.</div>
      <div class="box">2</div>
    </div>
    
    <div class="container">
      <span class="box">Ceci est un grand texte.</span>
      <span class="box">2</span><br/>
      <span class="box">Ceci est un grand texte.</span>
      <span class="box">2</span><br/>
    </div>
  </body>
</html>
