    <title>boite</title>
    <style>
        .container{
            border: 1px solid;
            background-color: teal;
        }

            display: inline-block;
            width: 100px;
            height: 100px;
            margin: 10px;
            background-color: pink;
            border: solid 15px black;
            padding: 10px;
        }

    </style>
</head>
<body>
    <h1>test boite</h1>

    <div class="container">
        <div class="box"><p>Maintenant, c'est un grand texte</p></div>
        <div class="box"><p>2</p></div>
    </div>
    <div class="container">
        <span class="box">1</span>
        <span class="box">2</span>

        <br>
        <span class="box">1</span>
        <span class="box">2</span>
    </div>
</body>
</html>
