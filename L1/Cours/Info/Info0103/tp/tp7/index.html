<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Boîtes Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .box1 {
            width: 100px;
            height: 100px;
        }
        .box2 {
            width: 200px;
            height: 100px;
        }
        .box3 {
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h4>1. Boîte de 100px par 100px</h4>
        <div class="box1 text-center text-white bg-success bg-opacity-50 border-start border-end border-5 border-primary rounded-3 mx-auto">
            <p>ceci est du text</p>
        </div>

        <h4 class="mt-5">2. Boîte de 200px par 100px</h4>
        <div class="box2 text-center pt-3 border border-top-0 border-success rounded-pill bg-warning bg-opacity-25 mx-auto">
            <p class="m-0">Ceci est le texte</p>
        </div>

        <h4 class="mt-5">3. Boîte avec autres propriétés</h4>
        <div class="box3 border-start-0 fw-bold text-info overflow-hidden bg-danger bg-opacity-50 border border-2 border-info rounded-start-5 mx-auto">
            <p>Ceci est<br>un texte<br>vraiment<br>très très<br>long</p>
        </div>

        <i class="bi bi-bootstrap"></i>



        <nav class="navbar navbar-expand-lg">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Lien actif</a>
                </li>
                <li class="nav-item">
                <a class="nav-link">Lien classique</a>
                </li>
                <li class="nav-item">
                <a class="nav-link disabled">Lien inactif</a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
