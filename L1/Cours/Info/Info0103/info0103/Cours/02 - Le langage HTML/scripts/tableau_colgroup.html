<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8"/>
    <title>Utilisation de colgroup</title> 
  </head>
  <body>
    <h1>Utilisation de colgroup pour spécifier un style</h1>
    <p>
      <table border="1">
        <colgroup>
          <col>
          <col style="background-color: red;">
        </colgroup>
        <tr>
          <th>Colonne 1</th>
          <th>Colonne 2</th>
        </tr>
        <tr>
          <td>Données 1</td>
          <td>Données 2</td>
        </tr>
        <tr>
          <td>Données 3</td>
          <td>Données 4</td>
        </tr>
        <caption>Un tableau tout simple</caption>
      </table>
    </p>
  </body>
</html>
