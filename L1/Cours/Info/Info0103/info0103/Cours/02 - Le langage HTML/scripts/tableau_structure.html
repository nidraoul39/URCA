<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8"/>
    <title>Tableau structuré</title> 
  </head>
  <body>
    <h1>Un tableau structuré</h1>
    <p>
      <table border="1">
        <thead>
          <tr>
            <th>Colonne 1</th>
            <th>Colonne 2</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Données 1</td>
            <td>Données 2</td>
          </tr>
          <tr>
            <td>Données 3</td>
            <td>Données 4</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <th>Colonne 1</th>
            <th>Colonne 2</th>
          </tr>
        </tfoot>
        <caption>Un tableau structuré</caption>
      </table>
    </p>
  </body>
</html>
