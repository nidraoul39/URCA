<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8"/>
    <title>Les liens en HTML</title> 
  </head>
  <body>
    <h1>Voici des exemples de liens</h1>
    <p>
      <a href="lien2.html">aller vers un document dans le même répertoire</a>.
    </p>
    <p>
      <a href="repertoire/index.html">aller vers un document dans un sous-répertoire</a>.
    </p>
    <p>
      <a href="repertoire/image.jpg">lien vers une image</a>.
    </p>
    <p>
      <a href="repertoire/image.pdf" download="image.pdf">lien vers un document</a> avec un attribut download.
    </p>
  </body>
</html>
