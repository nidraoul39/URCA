<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8"/>
    <title>Le padding</title> 
    <style>
div {
    width: 100px;
    height: 100px;
    border: 1px solid black;
}
.exemple {
    width: calc(60% - 1px);
    height: calc(60% - 1px);
    margin: 10%;
    padding: 10%;
    display: inline-block;
    border: 1px solid black;
}
    </style>
  </head>
  <body>
    <div class="bleu">
      <span class="exemple">Ici, il y a du texte</span>
    </div>
  </body>
</html>
