<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8"/>
    <title>Utilisation des classes CSS</title> 
    <style>
.maclasse {
    font-size: 1.5em;
    font-weight: 200;
    font-family: "Segoe UI";
}
p.maclasse {
    color: blue;
}
li {
    color: green;
}
li.maclasse {
    color: red;
}
    </style>
  </head>
  <body>
    <h1>Bonjour tout le monde !</h1>
    <p class="maclasse">
      Ceci est mon premier test en CSS
    </p>
    <ul>
      <li> Un élément simple </li>
      <li class="maclasse">Un élément associé à une classe</li>
    </ul>
  </body>
</html>
