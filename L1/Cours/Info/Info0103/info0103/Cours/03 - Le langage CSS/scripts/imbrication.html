<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8"/>
    <title>Exemple des media queries</title> 
    <style>
p {
  color: blue;
  
  strong {
    color: black;
  }
}
strong {
    color: red;
}
    </style>
  </head>
  <body>
    <h1>L'imbrication CSS</h1>
    <p>
      Le texte est en <strong>noir</strong>
    </p>
    <strong>
      Le texte est en rouge !
    </strong>
  </body>
</html>
