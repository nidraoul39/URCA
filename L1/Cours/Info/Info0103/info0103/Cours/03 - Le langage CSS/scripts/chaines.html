<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8"/>
    <title>Les bordures</title> 
    <style>
a::before {
    content: "« ";
}
a::after {
    content: " »";
}
    </style>
  </head>

    <div class="mabordure">
      <h1>Bonjour tout le monde !</h1>
      <p>
        Pour tout savoir, rendez-vous sur <a href="https://fr.wikipedia.org/" target="_blank">Wikipedia</a>.
      </p>
    </div>
  </body>
</html>
