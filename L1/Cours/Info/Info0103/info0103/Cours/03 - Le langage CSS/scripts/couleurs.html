<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8"/>
    <title>Les couleurs</title> 
    <style>
div {
    width: 100px;
    height: 100px;
    border: 1px solid black;
    margin: 10px;
}
.bleu {
    background-color: #0057B8;
}
.degrade {
    background-image: linear-gradient(180deg, #0057B8 20%, #FFD700 80%);
}
    </style>
  </head>
  <body>
    <div class="bleu"></div>
    <div class="degrade"></div>
  </body>
</html>
