<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8"/>
    <title>Exemple des media queries</title> 
    <style>
@media (max-width: 600px) {
    p {
        color: blue;
    }
}
@media (min-width: 600px) {
    p {
        color: red;
    }
}
    </style>
  </head>
  <body>
    <h1>Les medias queries</h1>
    <p>
      Le style qui change en fonction de la configuration de l'écran.
      Changez la taille de la fenêtre de votre navigateur pour voir la différence.
    </p>
  </body>
</html>
