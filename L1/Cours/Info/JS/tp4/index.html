<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1>Formulaire d'inscription</h1>
      <form action="https://www.cyrilrabat.fr/test.php" method="post">
        <div class="mb-3 row">
          <label for="inputEmail" class="col-sm-2 col-form-label">Email</label>
          <div class="col-sm-4">
            <input
              type="text"
              class="form-control"
              id="inputEmail"
              name="email"
              autofocus
            />
          </div>

          <label for="inputTelephone" class="col-sm-2 col-form-label"
            >Téléphone</label
          >
          <div class="col-sm-4">
            <input
              type="text"
              class="form-control"
              id="inputTelephone"
              name="telephone"
            />
          </div>

          <label for="date" class="col-sm-2 col-form-label"
            >Date de début</label
          >
          <div class="col-sm-4">
            <input
              type="date"
              class="form-control"
              id="inputDateDebut"
              name="dateDebut"
            />
          </div>
          <label for="date" class="col-sm-2 col-form-label">Date de fin</label>
          <div class="col-sm-4">
            <input
              type="date"
              class="form-control"
              id="inputDateFin"
              name="dateFin"
            />
          </div>
          <label for="date" class="col-sm-2 col-form-label"
            >Durée du séjour</label
          >
          <div class="col-sm-4">
            <input
              type="text"
              class="form-control-plaintext"
              id="inputDuree"
              value="Date incorrect ou non spécifié"
            />
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
