<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>Objets</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Objets">
    <meta name="author" content="Cyril Rabat">
  </head>
  <body>
    <h1>Les objets</h1>
    <p>Ouvrez la console...</p>
<script>
const person = {
  lastname: "Rabat",
  firstname: "Cyril",
  display: function() {
    console.log(this.firstname + " " + this.lastname);
  }
};

console.log("person.display() :");
person.display();
console.log('person["display"]() :');
person["display"]();

console.log("Affichage avec for...in :");
for(let item in person) {
    console.log("Elément `" + item + "` = " + person[item]);
}
</script>
  </body>
</html>
