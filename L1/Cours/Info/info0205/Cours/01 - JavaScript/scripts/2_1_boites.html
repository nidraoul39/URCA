<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>Les boîtes de dialogue</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Les boîtes de dialogue">
    <meta name="author" content="Cyril Rabat">
  </head>
  <body>
    <h1>Les boîtes de dialogue</h1>
    <button onclick="window.alert('Coucou')">Alert</button>
    <button onclick="window.confirm('Vous êtes sûr ?')">Confirm</button>
    <button onclick="window.prompt('Votre nom', 'Chuck Norris')">Prompt</button>
  </body>
</html>
